<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chaty</title><style>body{font-family:system-ui,sans-serif;background:#101827;color:white;max-width:680px;margin:25px auto;padding:15px}button,input{font:inherit;padding:10px;border-radius:9px;border:0}button{cursor:pointer;background:#6854e9;color:white;margin:3px}input{max-width:100%;box-sizing:border-box}nav{display:flex;flex-wrap:wrap}section{background:#202e45;border-radius:15px;padding:15px;margin:15px 0}#messages{height:220px;overflow:auto;background:#152035;padding:12px;border-radius:10px}.msg{padding:7px;margin:6px 0;background:#35435c;border-radius:10px;overflow-wrap:anywhere}.mine{background:#5548ae}small{color:#bbc8dd}#emoji{display:none}.tile{width:70px;height:70px;font-size:30px;background:#34445d}.hidden{display:none}#chats button{background:#34445d}</style></head><body><h1>💬 Chaty</h1><small>Family chat demo · Only on this device</small><nav><button onclick="tab('chat')">💬 Chats</button><button onclick="tab('contacts')">👥 Contacts</button><button onclick="tab('games')">🎮 Games</button></nav><section id="chat"><h2 id="chatname">🏠 Family Group</h2><div id="chats"></div><div id="messages"></div><p><button onclick="toggleEmoji()">😀</button><input id="message" placeholder="Write a message"><button onclick="send()">Send</button></p><div id="emoji"></div><button onclick="newGroup()">+ Create group</button></section><section id="contacts" class="hidden"><h2>Contacts</h2><input id="person" placeholder="Contact name"><button onclick="addContact()">Add</button><div id="people"></div><small>Names here are only demo contacts. They do not receive messages.</small></section><section id="games" class="hidden"><h2>🎮 Chaty Arcade</h2><h3>Rock Paper Scissors</h3><div><button onclick="rps(0)">✊</button><button onclick="rps(1)">✋</button><button onclick="rps(2)">✌️</button></div><p id="rpsResult"></p><h3>Guess the Number (1–10)</h3><input id="guess" type="number" min="1" max="10"><button onclick="checkGuess()">Guess</button><button onclick="resetGuess()">New number</button><p id="guessResult"></p><h3>Tic-Tac-Toe</h3><div id="board"></div><button onclick="resetBoard()">Restart</button><p id="tttResult"></p></section><script>
const initial={contacts:['Mom','Maya'],chats:[{id:'family',name:'🏠 Family Group',members:['Aiden','Mom','Maya'],messages:[{who:'Mom',body:'Welcome to Chaty! ❤️'},{who:'Maya',body:'Hi Aiden! 👋'}]}]};let state;try{state=JSON.parse(localStorage.getItem('chaty-demo'))||initial}catch{state=initial}let active='family';function save(){localStorage.setItem('chaty-demo',JSON.stringify(state))}function tab(id){for(const x of ['chat','contacts','games'])document.getElementById(x).classList.toggle('hidden',x!==id);render()}function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}function render(){const chat=state.chats.find(x=>x.id===active)||state.chats[0];document.getElementById('chatname').textContent=chat.name;const list=document.getElementById('chats');list.replaceChildren();state.chats.forEach(c=>{const b=el('button',c.name);b.onclick=()=>{active=c.id;render()};list.append(b)});const msgs=document.getElementById('messages');msgs.replaceChildren();chat.messages.forEach(m=>msgs.append(el('div',m.who+': '+m.body,'msg '+(m.who==='Aiden'?'mine':''))));msgs.scrollTop=msgs.scrollHeight;const people=document.getElementById('people');people.replaceChildren();state.contacts.forEach(p=>{const b=el('button','💬 '+p);b.onclick=()=>{const id='dm:'+p;if(!state.chats.some(c=>c.id===id))state.chats.push({id,name:p,members:['Aiden',p],messages:[]});active=id;save();tab('chat')};people.append(b)})}function send(){const field=document.getElementById('message'),body=field.value.trim();if(!body)return;state.chats.find(c=>c.id===active).messages.push({who:'Aiden',body});field.value='';save();render()}document.getElementById('message').addEventListener('keydown',e=>{if(e.key==='Enter')send()});function addContact(){const f=document.getElementById('person'),name=f.value.trim();if(!name||state.contacts.some(x=>x.toLowerCase()===name.toLowerCase())||name.toLowerCase()==='aiden')return;state.contacts.push(name);f.value='';save();render()}function newGroup(){const name=prompt('Group name?');if(!name||!name.trim())return;const selected=prompt('Which contacts? Type names separated by commas. Available: '+state.contacts.join(', '));if(selected===null)return;const members=selected.split(',').map(x=>x.trim()).filter(x=>state.contacts.includes(x));if(!members.length){alert('Choose at least one contact already in your list.');return}const id='group:'+Date.now();state.chats.push({id,name:'👥 '+name.trim(),members:['Aiden',...members],messages:[]});active=id;save();render()}const emojis='😀 😁 😂 🤣 😊 😍 🥰 😘 😎 🤩 🥳 😭 😱 🤯 😴 🤔 😜 👍 👎 👏 🙌 👋 🤝 💪 ❤️ 💜 💙 💚 💛 🖤 💯 🔥 ⭐ ✨ 🐶 🐱 🦊 🐼 🦁 🐸 🦄 🐬 🦋 🌈 ☀️ 🌙 🌸 🍕 🍔 🍦 ⚽ 🏀 🏈 ⚾ 🎮 🎲 🎯 🏆 🎵 🎸 🚀 🎉 🎁 💎 👑 🛸'.split(' ');emojis.forEach(e=>{const b=el('button',e);b.onclick=()=>document.getElementById('message').value+=e;document.getElementById('emoji').append(b)});function toggleEmoji(){const d=document.getElementById('emoji');d.style.display=d.style.display==='block'?'none':'block'}function rps(n){const theirs=Math.floor(Math.random()*3),icons=['✊','✋','✌️'];document.getElementById('rpsResult').textContent=icons[n]+' vs '+icons[theirs]+' — '+(n===theirs?'Tie!':(n-theirs+3)%3===1?'You win! 🎉':'Computer wins!')}let secret=Math.floor(Math.random()*10)+1;function checkGuess(){const n=Number(document.getElementById('guess').value);document.getElementById('guessResult').textContent=!Number.isInteger(n)||n<1||n>10?'Choose a number from 1 to 10':n===secret?'Correct! 🎉':n<secret?'Try higher ⬆️':'Try lower ⬇️'}function resetGuess(){secret=Math.floor(Math.random()*10)+1;document.getElementById('guess').value='';document.getElementById('guessResult').textContent='New number ready!'}let board=Array(9).fill(''),turn='X';const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function renderBoard(){const b=document.getElementById('board');b.replaceChildren();board.forEach((v,i)=>{const tile=el('button',v||'·','tile');tile.onclick=()=>{if(board[i]||lines.some(l=>board[l[0]]&&board[l[0]]===board[l[1]]&&board[l[1]]===board[l[2]]))return;board[i]=turn;turn=turn==='X'?'O':'X';renderBoard()};b.append(tile);if(i%3===2)b.append(document.createElement('br'))});const win=lines.find(l=>board[l[0]]&&board[l[0]]===board[l[1]]&&board[l[1]]===board[l[2]]);document.getElementById('tttResult').textContent=win?board[win[0]]+' wins! 🏆':board.every(Boolean)?'Tie!':turn+' turn'}function resetBoard(){board=Array(9).fill('');turn='X';renderBoard()}render();renderBoard();</script></body></html>
